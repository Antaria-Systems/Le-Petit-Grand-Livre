name: opendata-communes

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [backend]
    mem_limit: 384m

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      STORAGE_DIR: /data/storage
    volumes:
      - storage:/data/storage
    ports:
      - "10.1.0.2:8087:3000"
    depends_on:
      db:
        condition: service_healthy
    networks: [backend, frontend]
    mem_limit: 512m

  # Conteneur outil : migrations et imports open data
  #   docker compose run --rm tools npm run db:deploy
  #   docker compose run --rm tools npm run import:all
  tools:
    build:
      context: .
      target: tools
    profiles: [tools]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      STORAGE_DIR: /data/storage
    volumes:
      - storage:/data/storage
    depends_on:
      db:
        condition: service_healthy
    networks: [backend, frontend]

networks:
  # La base n'a aucun accès à Internet
  backend:
    internal: true
  frontend: {}

volumes:
  db-data:
  storage:
